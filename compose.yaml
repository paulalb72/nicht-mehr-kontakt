services:
  abmeldung:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_FILE: /app/data/optouts.json
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
      TOKEN_SECRET: ${TOKEN_SECRET:?}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:?}
      NOTIFY_TO: ${NOTIFY_TO:?}
    volumes:
      - optouts:/app/data

volumes:
  optouts:
